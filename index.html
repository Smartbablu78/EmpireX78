<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Join Our Community</title>
    <meta name="description" content="Join our official Telegram community for updates and notifications.">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="page-shell">

        <main class="landing-card">

            <div class="live-badge">
                <span class="live-dot"></span>
                <span>LIVE ON TELEGRAM</span>
            </div>

            <!-- Replace channel-image.jpg with your own channel image -->
            <div class="profile-image-wrap">
                <img
                    src="imagelogo.jpg"
                    alt="Telegram channel"
                    class="profile-image"
                >
            </div>

            <h1>The Empire X</h1>

            <p class="intro">
                Join our premium Telegram community with a clean,
                modern experience and instant updates.
            </p>

            <!-- Top Telegram button -->
            <a
    class="telegram-btn"
    href="https://t.me/+fcQtt2tXPgZhMWVl"
    target="_blank"
    rel="noopener noreferrer"
    onclick= "fbq('track', 'Subscribe');"
>
    <span class="telegram-icon">✈</span>
    <span>JOIN TELEGRAM</span>
    <span class="button-arrow">→</span>
</a>

            <section class="stats-grid">
                <div class="stat-card">
                    <strong>24/7</strong>
                    <span>Active</span>
                </div>

                <div class="stat-card">
                    <strong>Fast</strong>
                    <span>Updates</span>
                </div>

                <div class="stat-card">
                    <strong>VIP</strong>
                    <span>Community</span>
                </div>
            </section>

            <section class="feature-list">
                <div class="feature-item">
                    <span class="feature-icon">✨</span>
                    <span>Premium Community Experience</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">⚡</span>
                    <span>Instant Notifications</span>
                </div>

                <div class="feature-item">
                    <span class="feature-icon">🛡️</span>
                    <span>Secure &amp; Mobile Friendly</span>
                </div>
            </section>

            <!-- Bottom Telegram button -->
           <a
    class="telegram-btn bottom-btn"
    href="https://t.me/+fcQtt2tXPgZhMWVl"
    target="_blank"
    rel="noopener noreferrer"
    onclick="fbq('track', 'Lead'); fbq('track', 'Subscribe');"
>
    <span class="telegram-icon">✈</span>
    <span>JOIN NOW</span>
    <span class="button-arrow">→</span>
</a>

        </main>

    </div>

    <!-- <script src="script.js"></script> -->
</body>
</html>
